id: io.github.aleluc.BidAnalyzer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: io.github.aleluc.BidAnalyzer

# PySide BaseApp includes NumPy, which pandas needs. Remove Qt WebEngine,
# because UPS Bid Analyzer does not use it.
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

finish-args:
  # Qt display support.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Initial compatibility permissions. These let the current application
  # browse for PDFs and export Excel files without requiring code changes.
  # These can be narrowed later by relying entirely on desktop portals.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # Generated by refresh_python_dependencies.sh.
  - pypi-dependencies.json

  - name: ups-bid-analyzer
    buildsystem: simple
    build-commands:
      # Keep the existing src-layout intact. This avoids depending on the
      # project's Python packaging metadata and guarantees that resources such
      # as airports.csv and the application images stay beside the package.
      - mkdir -p /app/lib/ups-bid-analyzer
      - cp -a src /app/lib/ups-bid-analyzer/
      - python3 -m compileall -q /app/lib/ups-bid-analyzer/src

      # Desktop integration.
      - install -Dm755 packaging/linux/ups-bid-analyzer-launcher.sh /app/bin/io.github.aleluc.BidAnalyzer
      - install -Dm644 packaging/linux/io.github.aleluc.BidAnalyzer.desktop /app/share/applications/io.github.aleluc.BidAnalyzer.desktop
      - install -Dm644 packaging/linux/io.github.aleluc.BidAnalyzer.metainfo.xml /app/share/metainfo/io.github.aleluc.BidAnalyzer.metainfo.xml
      - install -Dm644 src/bid_analyzer/resources/app_icon.png /app/share/icons/hicolor/512x512/apps/io.github.aleluc.BidAnalyzer.png

    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .git/*
          - .idea
          - .idea/*
          - .vscode
          - .vscode/*
          - .pytest_cache
          - .pytest_cache/*
          - __pycache__
          - '*.pyc'
          - ups-venv
          - ups-venv/*
          - .venv
          - .venv/*
          - build
          - build/*
          - packaging/windows
          - packaging/windows/*
          - packaging/linux/build-dir
          - packaging/linux/build-dir/*
          - packaging/linux/repo
          - packaging/linux/repo/*
          - packaging/linux/dist
          - packaging/linux/dist/*
