name: Build Linux Flatpak

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/linux/installer_linux.yml
          bundle: UPS_Bid_Analyzer_1.0.0_x86_64.flatpak
          branch: master
          arch: x86_64
          upload-artifact: true
          artifact-name: UPS-Bid-Analyzer-Flatpak-x86_64
