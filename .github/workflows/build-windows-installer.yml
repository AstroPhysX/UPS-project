name: Build Windows Installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Bid Analyzer Windows Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Create build virtual environment
        shell: cmd
        run: python -m venv ups-venv

      - name: Install Python dependencies
        shell: cmd
        run: |
          ups-venv\Scripts\python.exe -m pip install --upgrade pip
          ups-venv\Scripts\python.exe -m pip install -r requirements.txt
          ups-venv\Scripts\python.exe -m pip install pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            exit $LASTEXITCODE
          }

      - name: Build application and installer
        shell: cmd
        run: call packaging\windows\build_windows_with_installer.bat

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Bid-Analyzer-Windows-Installer-${{ github.sha }}
          path: packaging/windows/installer/Bid_Analyzer_Setup_*.exe
          if-no-files-found: error
          retention-days: 14
